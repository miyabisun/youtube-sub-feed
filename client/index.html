<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>youtube-sub-feed</title>
    <script>
      window.__BASE_PATH__ = ''
      window.__GIS_CLIENT_ID__ = ''
    </script>
    <!-- Google Identity Services (GIS) for browser-side channel sync.
         NOTE: SRI (integrity=) cannot be applied to this script because Google
         updates it in-place and does not publish a stable hash. This is a known
         trade-off of using Google's hosted GIS SDK. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cloudflare Access guards the site, and a manifest fetch omits cookies unless asked. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Installed app on Android Chrome: the system buttons sit over the window background,
         fixed at install from the manifest background_color, and take their contrast from
         theme-color. Keep both on Sumi (--c-bg, dark) whatever the OS theme. This must
         precede the page-mirroring meta that lib/theme-color.js appends, so it wins there. -->
    <meta name="theme-color" media="(display-mode: standalone)" content="#191919" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
